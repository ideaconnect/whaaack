name: Pages

# Publishes website/ to GitHub Pages as a PROJECT page under the ideaconnect org's
# apex custom domain, served at https://idct.tech/whaaack/.
#
# The site is plain static HTML — no Jekyll, no build step — so this workflow only
# checks the tree is sound and hands website/ straight to Pages.
#
# One-time setup (already done on this repo): Settings → Pages → Source: GitHub
# Actions, and the custom-domain field left BLANK. The project inherits the org's
# apex domain, configured on the ideaconnect.github.io page repo, and serves under
# the /whaaack/ path. See the "no CNAME" step below for why that field must stay
# empty.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  # Runs on PRs too, so a broken site is caught before it reaches the domain.
  # Nothing is uploaded or deployed from a PR — see the `if` guards below.
  pull_request:
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel a publish that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The privacy policy and terms have to stay reachable at a stable URL —
      # Google Play requires an active, publicly accessible, non-PDF policy URL,
      # and the app links these pages directly from its About screen. A rename
      # that quietly 404s one of them is a store-review failure, so assert the
      # structure rather than discovering it later.
      - name: Verify required pages exist
        run: |
          missing=0
          for f in \
            website/index.html \
            website/privacy/index.html \
            website/terms/index.html \
            website/delete-account/index.html \
            website/contact/index.html \
            website/contact/thanks/index.html \
            website/auth/index.html \
            website/404.html \
            website/sitemap.xml \
            website/app-ads.txt \
            website/assets/css/site.css \
            website/assets/js/site.js \
            website/assets/js/backend-config.js
          do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing

      # The only line in app-ads.txt that has any effect, and the only file here that
      # nothing else can vouch for: no page links to it, so a mangled record would not
      # break a link, fail an anchor check or 404 anywhere. The header is long enough that
      # an edit can leave it looking untouched. The publisher id must stay in step with the
      # AdMob application id in app/build.gradle.kts.
      - name: Verify the app-ads.txt record is intact
        run: |
          grep -qxF 'google.com, pub-6904561240517963, DIRECT, f08c47fec0942fa0' website/app-ads.txt \
            || { echo "::error file=website/app-ads.txt::the DIRECT record line is missing or altered"; exit 1; }

      # The publishable key reaches the site by injection at deploy time, never by commit -
      # website/assets/js/backend-config.js says what it is and why, and
      # tools/sync_zepp_secrets.py made the same call for the watch. A real key pasted in
      # here would work perfectly, which is exactly why nothing would ever notice.
      - name: Verify the publishable key is not committed
        run: |
          grep -qF '__SUPABASE_PUBLISHABLE_KEY__' website/assets/js/backend-config.js \
            || { echo "::error file=website/assets/js/backend-config.js::the placeholder is gone - the key must not be committed here"; exit 1; }

      # The contact form redirects here after a successful submit, and Web3Forms
      # sends the visitor to whatever absolute URL is baked into the form. If the
      # two ever drift the player lands on a 404 having just been told the message
      # was sent.
      - name: Verify the contact form redirect matches the thanks page
        run: |
          grep -q 'value="https://idct.tech/whaaack/contact/thanks/"' website/contact/index.html \
            || { echo "::error::contact form redirect does not point at /whaaack/contact/thanks/"; exit 1; }

      # Each page must point its canonical at its own URL. These <head> blocks were written
      # by copying the previous page's, which is exactly how two pages end up claiming one
      # canonical — and the loser then drops out of the index with no error anywhere.
      - name: Verify each canonical matches its own path
        run: |
          fail=0
          check() {
            grep -q "<link rel=\"canonical\" href=\"$2\">" "$1" \
              || { echo "::error file=$1::canonical is not $2"; fail=1; }
          }
          check website/index.html                https://idct.tech/whaaack/
          check website/privacy/index.html        https://idct.tech/whaaack/privacy/
          check website/terms/index.html          https://idct.tech/whaaack/terms/
          check website/delete-account/index.html https://idct.tech/whaaack/delete-account/
          check website/contact/index.html        https://idct.tech/whaaack/contact/
          exit $fail

      # The sitemap has to list exactly the canonical pages. A page added to the site and
      # forgotten here is invisible to search; a page removed and left here is a 404 served
      # to a crawler. Neither surfaces anywhere else.
      - name: Verify the sitemap matches the canonical pages
        run: |
          python3 - <<'EOF'
          import re, sys, xml.etree.ElementTree as ET
          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          listed = {e.text.strip() for e in ET.parse("website/sitemap.xml").getroot().iter(NS + "loc")}
          pages = ["website/index.html", "website/privacy/index.html", "website/terms/index.html",
                   "website/delete-account/index.html", "website/contact/index.html"]
          canon = set()
          for page in pages:
              m = re.search(r'<link rel="canonical" href="([^"]+)"', open(page, encoding="utf-8").read())
              if m:
                  canon.add(m.group(1))
          missing, extra = canon - listed, listed - canon
          for u in sorted(missing):
              print(f"::error::sitemap.xml is missing {u}")
          for u in sorted(extra):
              print(f"::error::sitemap.xml lists {u}, which no page claims as its canonical")
          sys.exit(1 if (missing or extra) else 0)
          EOF

      # In-page anchors are checked by nothing else, and a renamed heading id fails silently:
      # the link still resolves, it just scrolls nowhere. The cross-page ones (privacy ->
      # /whaaack/#adfree) are the easiest to break and the least likely to be noticed.
      - name: Verify every in-page anchor resolves
        run: |
          python3 - <<'EOF'
          import re, glob, sys, os
          def url_of(path):
              rel = os.path.relpath(path, "website").replace(os.sep, "/")
              return "/whaaack/" + rel.replace("index.html", "")
          ids = {}
          for path in glob.glob("website/**/*.html", recursive=True):
              html = open(path, encoding="utf-8").read()
              ids[url_of(path)] = set(re.findall(r'\sid="([^"]+)"', html))
          fail = 0
          for path in glob.glob("website/**/*.html", recursive=True):
              html = open(path, encoding="utf-8").read()
              here = url_of(path)
              for href in re.findall(r'href="([^"]*#[^"]+)"', html):
                  page, frag = href.split("#", 1)
                  target = here if page == "" else page
                  if not target.startswith("/whaaack/"):
                      continue
                  if target not in ids:
                      print(f"::error file={path}::{href} points at a page that does not exist")
                      fail = 1
                  elif frag not in ids[target]:
                      print(f"::error file={path}::{href} has no matching id on {target}")
                      fail = 1
          sys.exit(fail)
          EOF

      # Two things that must never appear in this tree: a cleartext http:// URL, and a
      # third-party host nobody declared.
      #
      # Only two hosts are actually *loaded* from — idct.tech and js.hcaptcha.com — and one
      # more receives data on submit (api.web3forms.com). Those three are recipients of a
      # visitor's data and every one of them has to appear in the privacy policy's recipients
      # list; js.hcaptcha.com sat there undisclosed for exactly as long as nothing checked.
      # The rest of the allow-list is plain outbound links, which send nothing — they are
      # listed anyway because a *new* host appearing is worth one deliberate look either way,
      # and because a resource load and a link are one attribute apart.
      #
      # The Supabase project host is the fourth recipient, and the only one a page here *sends*
      # to rather than loads from: /whaaack/auth/ PUTs a new password to it when somebody
      # follows a reset link that came from the watch edition. It is in the privacy policy's
      # recipients list, where it already stood as the game's backend.
      #
      # play.google.com is pre-approved: the store badge is scheduled to land here at launch,
      # and a red CI run on that edit would be noise rather than signal.
      #
      # takeout.google.com is the delete-account page's route to a player's own Play Games
      # player ID, which they need in order to name the account they are asking us to delete.
      # An outbound link and nothing more — the page sends it no data, so it is not a
      # recipient and does not belong in the privacy policy's list. It gets a line here
      # because the deliberate look it exists to force has now been taken.
      - name: Verify no cleartext URLs and no undeclared third-party hosts
        run: |
          set -u
          if grep -rn 'http://' website/ --include=*.html --include=*.css --include=*.js | grep -v 'w3.org' | grep -v 'sitemaps.org'; then
            echo "::error::cleartext http:// URL in website/"
            exit 1
          fi
          grep -rhoE 'https://[a-zA-Z0-9.-]+' website/ --include=*.html --include=*.css --include=*.js | sed 's|https://||' | sort -u > hosts.txt
          cat > allowed.txt <<'HOSTS'
          idct.tech
          pklrfcbyseitdbxkmsnw.supabase.co
          api.web3forms.com
          js.hcaptcha.com
          github.com
          play.google.com
          support.google.com
          policies.google.com
          takeout.google.com
          uodo.gov.pl
          uokik.gov.pl
          HOSTS
          sed -i 's/^ *//' allowed.txt
          # grep -vxF, not comm: comm requires both inputs sorted in the same collation and
          # silently misreports when they are not — it warned "file 2 is not in sorted order"
          # and still exited 0, which is a guard that passes for the wrong reason.
          undeclared=$(grep -vxF -f allowed.txt hosts.txt || true)
          rm -f hosts.txt allowed.txt
          if [ -n "$undeclared" ]; then
            echo "::error::undeclared third-party host(s): $undeclared"
            echo "Add it to the allow-list in this step AND to the recipients list in the privacy policy."
            exit 1
          fi

      # A project page under the org's apex domain must NOT ship a CNAME: one would
      # claim idct.tech at its root and collide with the org page that owns it.
      - name: Verify no project CNAME
        run: test ! -f website/CNAME

      - uses: actions/configure-pages@v6

      # The publishable key goes into the copy that is about to be uploaded, and nowhere else.
      # See website/assets/js/backend-config.js for what it is and why it is not in git.
      #
      # Deliberately fatal when the secret is unset. The page that needs it takes a password
      # from somebody who is locked out of their account; publishing it still pointed at the
      # placeholder would put up a form that accepts a password and changes nothing - the one
      # outcome worse than the page not being there at all. A red run here is a five-second
      # fix (gh secret set SUPABASE_PUBLISHABLE_KEY); a green one hiding a dead form is not.
      #
      # Substituted in Python rather than with sed because the key is opaque text nobody here
      # reads, and a single / or & in it would silently mangle a sed replacement into
      # something that still looks like a key.
      - name: Put the publishable key into the copy being deployed
        if: github.ref == 'refs/heads/main'
        env:
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${KEY}" ]; then
            echo "::error::the SUPABASE_PUBLISHABLE_KEY repository secret is not set"
            echo "Set it with: gh secret set SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          python3 - <<'EOF'
          import os, pathlib
          path = pathlib.Path("website/assets/js/backend-config.js")
          text = path.read_text(encoding="utf-8")
          if "__SUPABASE_PUBLISHABLE_KEY__" not in text:
              raise SystemExit("::error::no placeholder to replace in backend-config.js")
          path.write_text(text.replace("__SUPABASE_PUBLISHABLE_KEY__", os.environ["KEY"]),
                          encoding="utf-8")
          EOF
          if grep -qF '__SUPABASE_PUBLISHABLE_KEY__' website/assets/js/backend-config.js; then
            echo "::error::the placeholder survived the substitution"
            exit 1
          fi
          echo 'publishable key injected'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
