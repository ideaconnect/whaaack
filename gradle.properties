org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Optimized resource shrinking — resources shrunk by R8 as part of the same reference graph as the
# code, which is what Google Play's R8 suggestion asks for — is the default from AGP 9 and needs no
# flag here. It is safe for this app because nothing looks a resource up by name: there is no
# Resources.getIdentifier call and no resValue anywhere, and the sprites and audio are streamed from
# assets/, which the shrinker does not touch. Code that does add a lookup by name has to declare the
# resource in a raw/keep.xml, or it will be shrunk away with no error.

kotlin.code.style=official
