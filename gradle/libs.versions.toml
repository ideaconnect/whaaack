[versions]
# 9.x is what Google Play's R8 suggestion asks for. 9.0.x rather than the newest 9.3: it is the
# only 9.x that runs on the Gradle this wrapper already pins (9.1.0), so the upgrade moves one
# thing at a time. AGP 9 also brings built-in Kotlin — see the note beside kotlin-android below.
agp = "9.0.1"
kotlin = "2.2.20"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"
# 5.x verified against this app rather than its release notes: compiles, 15 unit tests pass,
# R8 full-mode release builds with no missing_rules.txt, lintVitalRelease clean, and the
# transitive okhttp-android it now pulls adds no permission to the merged manifest.
okhttp = "5.1.0"
serialization = "1.7.3"
coroutines = "1.9.0"
# 25.4.0 pulls user-messaging-platform 4.0.0 transitively (via play-services-ads-api),
# so the UMP pin below is for readability, not for control — dropping it would not hold
# the app on 3.1.0. Both libraries require minSdk 23; this app is 26.
playServicesAds = "25.4.0"
userMessagingPlatform = "4.0.0"
# Play Games Services v2. The "v2" artifact is the whole point: v1's
# play-services-games is the deprecated GoogleSignIn-based SDK, and mixing the two in one
# app is the classic way to end up with two competing sign-in prompts. v2 signs the player
# in by itself and has no GoogleSignInAccount anywhere in its API. Requires minSdk 19; this
# app is 26. Its only transitive dependencies are play-services-base/basement/tasks, which
# play-services-ads already pulls in.
playServicesGames = "22.0.0"
credentials = "1.3.0"
googleid = "1.1.1"
billing = "9.1.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }
play-services-games-v2 = { group = "com.google.android.gms", name = "play-services-games-v2", version.ref = "playServicesGames" }

androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Same version as okhttp itself, so the server in tests speaks exactly the HTTP the client does.
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android alias: AGP 9 compiles Kotlin itself (`android.builtInKotlin`, on by default)
# and the old plugin is incompatible with its new DSL. The Kotlin *version* is still this project's
# to choose — see the buildscript pin in the root build file, which holds KGP at `kotlin` above so
# the Compose compiler plugin below keeps matching the compiler that runs.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
