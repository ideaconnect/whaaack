# Remote auth configuration for the linked Whaaack! project.
# Push with:  supabase config push
#
# Secrets are read from the environment via env(...) so nothing sensitive is committed.
# Required environment variables:
#   RESEND_API_KEY        Resend SMTP password (the API key itself)
#   GOOGLE_CLIENT_ID      web client id, then the Android one, comma-separated
#   GOOGLE_CLIENT_SECRET  secret of the *web* client
#
# Every env(...) here must be set on every push. An unset variable is left as the
# literal string "env(NAME)" and pushed verbatim, which would overwrite the remote
# secret with garbage.

project_id = "pklrfcbyseitdbxkmsnw"

[auth]
# Deep link the app registers for password-reset and confirmation callbacks.
site_url = "whaaack://auth"
additional_redirect_urls = ["whaaack://auth", "https://idct.tech/whaaack/auth"]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Ranked play requires an account, but nothing about the game needs anonymous rows.
enable_anonymous_sign_ins = false
enable_signup = true

[auth.email]
enable_signup = true
# Players must prove the address before their name can appear on a public leaderboard.
enable_confirmations = true
double_confirm_changes = true
# Verified against the live project rather than reasoned about: with this on, a bare
# PUT /auth/v1/user is accepted on a session under a day old and refused with
# reauthentication_needed on one aged past it. So it never showed up in testing and would
# have shipped as "Something went wrong" for returning players only.
#
# Turned off deliberately. What it protects against is somebody holding an unlocked phone
# with a live session — and that same Settings screen already offers account deletion with
# no reauthentication at all, so guarding the password while delete sits unguarded beside it
# buys nothing. The alternative was a POST /auth/v1/reauthenticate round trip, which costs an
# emailed nonce per password change out of the project-wide email budget that signups share.
#
# Note the recovery flow was never affected: a reset link mints a brand-new session, so
# "forgot password" lands inside the carve-out and worked either way.
secure_password_change = false
max_frequency = "60s"
otp_expiry = 1800

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
# 587 (STARTTLS). Supabase's mailer negotiates STARTTLS and does not speak implicit TLS,
# so port 465 fails with "Error sending confirmation email".
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
# The sending domain must be verified in Resend before delivery will succeed.
admin_email = "noreply@idct.tech"
sender_name = "Whaaack!"

# [auth.sessions] (timebox / inactivity_timeout) needs a Pro plan; on Free the
# refresh-token rotation above is what bounds a stale session.

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
anonymous_users = 10

# Google sign-in. Both OAuth clients exist in Google Cloud project whaaack-505409; this is
# live once GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are exported and pushed. See
# docs/SETUP.md section 3.
[auth.external.google]
enabled = true
# Credential Manager returns an ID token minted for the Android client, so Supabase has to
# accept that audience alongside the web client it verifies against. There is no separate
# field for it: the remote splits this value on commas into client_id plus the dashboard's
# "Authorized Client IDs". GOOGLE_CLIENT_ID therefore holds both, web first:
#
#   964578061899-aaiu8iv8u6fngd93to4vkma91abip7k8.apps.googleusercontent.com,964578061899-o3srji4j87lltkc3bphbsv6o6hj4t9b1.apps.googleusercontent.com
#
# The two cannot live in separate variables: the CLI matches env(...) anchored end to end,
# so "env(A),env(B)" is never substituted — it is pushed as that literal text.
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# The app hashes a nonce into the Google request and sends the raw value to Supabase
# alongside the token, so leave verification on.
skip_nonce_check = false

# ------------------------------------------------------------------------------- functions

# Turns a Play Games server auth code into a session, so a player who has Play Games and no
# Whaaack! account can still be ranked. See supabase/functions/play-games-auth/index.ts, and
# docs/SETUP.md for the two secrets it needs.
#
# verify_jwt must be OFF for this project. The gateway check parses the Authorization bearer
# as a JWT, and this project runs on the new-format sb_publishable_ key — which is not one —
# so with the check on, every call 401s as "Invalid JWT" before the function runs, and
# nothing ever appears in its logs. (The first draft here reasoned from the legacy anon key,
# which *was* a JWT and did satisfy the check.) The function performs the same
# keep-off-the-open-internet gate itself, by comparing the `apikey` header against
# SUPABASE_ANON_KEY — the real security boundary is the Google code exchange either way.
# Applied at `supabase functions deploy`, not `config push`.
[functions.play-games-auth]
verify_jwt = false
