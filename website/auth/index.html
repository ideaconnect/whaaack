<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Whaaack! account — Whaaack!</title>
<meta name="description" content="Confirms the email address on a Whaaack! account, and sets a new password from a reset link.">
<meta name="theme-color" content="#140a1a">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/icon/favicon.ico" sizes="any">
<link rel="icon" href="../assets/img/icon/whaaack-32.png" type="image/png">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<!--
  Where an emailed link from the Zepp OS edition lands — both kinds.

  The phone game sends its links to `whaaack://auth`, a deep link only it can answer, and
  that is right for the phone game: the app is by definition installed. It is wrong for the
  watch. An account can be created, confirmed and recovered entirely from the Whaaack!
  settings page inside the Zepp app, by somebody who has never installed the Android
  version and has no reason to — and for them a deep link is a dead end at the exact moment
  they are trying to get in. So the watch's signup and its reset both ask GoTrue to send
  them here instead (see zeppos/shared/supabase.js).

  Confirming was the easy half: the answer is a sentence. Resetting needs somewhere to type
  a new password, which is why this page carries a form. The link arrives already verified
  by GoTrue — /auth/v1/verify has redirected here with a real, short-lived session in the
  fragment — so the form's whole job is to spend that token on one PUT /auth/v1/user. The
  token is the proof; the page never asks for the old password, because the server would
  not check it (`secure_password_change = false`, and recovery was always inside that
  carve-out anyway).

  Which flow a link belongs to is decided per request, by the `redirect_to` on the call that
  sent the mail. Nothing about the project's configuration changes, and the phone game is
  untouched — its own reset links still open the Android app.

  This page is told what happened in the URL *fragment* — `#access_token=...&type=signup`
  or `&type=recovery` on success, `#error=...&error_code=...` on a link that has expired or
  been used. A fragment never reaches a server, so only the script below can read it, which
  is why the markup starts out saying neither thing and <noscript> says so honestly.

  Nothing is stored. The token lives in one local variable for as long as the form is on
  screen, the fragment is stripped out of the address bar as soon as it has been read so it
  is not left in history or handed on in a Referer, and a successful change gives the token
  straight back with a logout.
-->
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="orchard" aria-hidden="true">
  <span class="sky"></span>
  <span class="trees"></span>
  <span class="hills"></span>
  <span class="scrim"></span>
</div>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/whaaack/">
      <img src="../assets/img/icon/whaaack-64.png" alt="" width="30" height="30">
      Whaaack!
    </a>
    <nav class="nav">
      <a href="/whaaack/">Home</a>
      <a href="/whaaack/privacy/">Privacy</a>
      <a href="/whaaack/terms/">Terms</a>
      <a href="/whaaack/contact/">Contact</a>
    </nav>
  </div>
</header>

<main id="main" class="section">
  <div class="wrap" style="text-align:center">
    <div id="auth-mark" style="font-size:4rem;line-height:1;margin-bottom:18px" aria-hidden="true">🍉</div>
    <span class="eyebrow" id="auth-eyebrow">Account</span>
    <h1 id="auth-title" style="font-size:clamp(2rem,5vw,3rem)">Checking your link…</h1>

    <div id="auth-body" role="status" aria-live="polite">
      <noscript>
        <p class="lead" style="margin-inline:auto">
          This page reads the result out of the link you followed, and it needs JavaScript
          to do it. If you came here to confirm an address, it has almost certainly been
          confirmed — go back to the Whaaack! settings in the Zepp app and sign in. If you
          came here to set a new password, turn JavaScript on and open the link again; the
          form cannot run without it.
        </p>
      </noscript>
    </div>

    <!--
      Hidden until a recovery link says otherwise, and written here rather than built by
      script so the field, its label and its hint are all in the document a screen reader
      parses. `novalidate` because the three sentences this form can say about a password
      are the same three the watch and the phone say, and a native "Please lengthen this
      text" bubble would preempt them with a fourth voice.
    -->
    <form id="reset-form" class="contact-form" style="margin-inline:auto;text-align:left" hidden novalidate>
      <p class="form-error" id="reset-problem" role="alert" hidden></p>

      <div class="field">
        <label for="new-password">New password</label>
        <div class="pw-row">
          <input type="password" id="new-password" name="new-password"
                 autocomplete="new-password" autocapitalize="off" autocorrect="off"
                 spellcheck="false" aria-describedby="pw-hint">
          <button type="button" class="pw-toggle" id="pw-toggle" aria-pressed="false">Show</button>
        </div>
        <p class="pw-hint" id="pw-hint">At least 8 characters, with a letter and a digit.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Set new password</button>
    </form>

    <p style="margin-top:30px">
      <a class="btn btn-primary" href="/whaaack/">Back to the orchard</a>
    </p>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <span>© <span data-year>2026</span> <a href="https://idct.tech">IDCT · Bartosz Pacholek</a></span>
    <nav>
      <a href="/whaaack/">Home</a>
      <a href="/whaaack/privacy/">Privacy</a>
      <a href="/whaaack/terms/">Terms</a>
      <a href="/whaaack/contact/">Contact</a>
    </nav>
  </div>
</footer>

<script src="../assets/js/backend-config.js"></script>
<script>
/* Reads the outcome out of the link, says what happened, and — for a reset — takes the new
   password.

   Inline rather than in site.js because it has to run before anything can paint the wrong
   answer, and because it is the only page on the site that does any of this. ES5 plus
   `fetch`: the same floor the rest of the site assumes, and anything that can open a link
   out of an email has had both for years. */
(function () {
  'use strict';

  var mark = document.getElementById('auth-mark');
  var eyebrow = document.getElementById('auth-eyebrow');
  var title = document.getElementById('auth-title');
  var body = document.getElementById('auth-body');
  var form = document.getElementById('reset-form');
  var input = document.getElementById('new-password');
  var toggle = document.getElementById('pw-toggle');
  var problem = document.getElementById('reset-problem');
  var submit = document.getElementById('reset-submit');

  var backend = window.WHAAACK_BACKEND || {};
  /* The placeholder is still a placeholder unless the deploy replaced it, and a form
     posting to nothing is worse than no form at all: it takes a password, looks like it
     worked, and leaves the account exactly as locked as it was. */
  var configured =
    /^https:\/\//.test(backend.url || '') && (backend.key || '').indexOf('__') !== 0;

  /* GoTrue puts the result in the fragment, and some failures in the query string
     instead, so both are read and the fragment wins where they disagree. */
  function params() {
    var out = {};
    [window.location.search, window.location.hash].forEach(function (part) {
      if (!part || part.length < 2) return;
      part.slice(1).split('&').forEach(function (pair) {
        if (!pair) return;
        var i = pair.indexOf('=');
        var key = decodeURIComponent((i < 0 ? pair : pair.slice(0, i)).replace(/\+/g, ' '));
        var value = i < 0 ? '' : decodeURIComponent(pair.slice(i + 1).replace(/\+/g, ' '));
        if (key) out[key] = value;
      });
    });
    return out;
  }

  function say(emoji, eyebrowText, headline, paragraphs) {
    mark.textContent = emoji;
    eyebrow.textContent = eyebrowText;
    title.textContent = headline;
    /* The tab, the history entry this page leaves behind, the task switcher and any
       bookmark all read the <title>, and none of them read the headline. Left at a
       hard-coded "Email confirmed" it would tell somebody checking their history days
       later that a signup went through when the link had in fact expired. */
    document.title = headline + ' — Whaaack!';
    body.textContent = '';
    paragraphs.forEach(function (text) {
      var p = document.createElement('p');
      p.className = 'lead';
      p.style.marginInline = 'auto';
      p.textContent = text;
      body.appendChild(p);
    });
  }

  var query = params();

  /* Out of the address bar before anything else happens. The token is of no use to
     anybody but this page, and there is no reason for it to survive in history, in a
     bookmark, or in a Referer header on the way to the next click. It is held in the
     closure instead, and given back at the end. */
  var token = query.access_token || '';
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  // -------------------------------------------------------------------- the reset form

  /* The rules `validatePassword` enforces on the watch and `isStrongPassword` on the
     phone, in the same order and the same words. GoTrue is the authority
     (`minimum_password_length = 8`, `password_requirements = "letters_digits"`) and all
     three copies have to move together. Said as separate facts rather than as one rule,
     because "letters and digits" leaves somebody guessing which half is missing. */
  function complaintAbout(password) {
    if (password.length < 8) return 'Passwords are at least 8 characters.';
    if (!/[A-Za-z]/.test(password)) return 'Add at least one letter to the password.';
    if (!/[0-9]/.test(password)) return 'Add at least one digit to the password.';
    return null;
  }

  function showProblem(message) {
    problem.textContent = message;
    problem.hidden = false;
  }

  function busy(on) {
    submit.disabled = on;
    input.disabled = on;
    submit.textContent = on ? 'Setting it…' : 'Set new password';
  }

  /* Best effort, and deliberately not waited on. `secure_password_change` is off, so the
     session that made the change stays valid — this page has no further use for it, and
     giving it back is one fewer live refresh token in the world. A failure changes
     nothing: the password is already set, and the token dies of old age within the hour. */
  function handBackTheToken(spent) {
    try {
      fetch(backend.url + '/auth/v1/logout', {
        method: 'POST',
        headers: {
          apikey: backend.key,
          Authorization: 'Bearer ' + spent,
          'Content-Type': 'application/json',
        },
        body: '{}',
      })['catch'](function () {});
    } catch (e) {
      /* Deliberately ignored — see above. */
    }
  }

  function succeeded(spent) {
    form.hidden = true;
    say('🔑', 'Password reset', 'That is your new password.', [
      'It is set. Nothing else needs doing here, and this link is now spent.',
      'Go back to Whaaack! — the settings page in the Zepp app on your phone, or the Android game — and sign in with it.',
    ]);
    handBackTheToken(spent);
  }

  function expired() {
    form.hidden = true;
    say('🙈', 'Link problem', 'That link has expired.', [
      'Reset links are good for a limited time and can only be used once — this one is past it, or has already been used.',
      'Open Whaaack! in the Zepp app on your phone, tap "Email me a reset link" again, and use the new mail.',
    ]);
  }

  /* What a refusal means, in words somebody can act on. `fatal` is the distinction that
     matters: a dead token means the form has nothing left to spend and should go away,
     while a password GoTrue did not like leaves the form exactly as usable as it was. */
  function refusal(status, payload) {
    var code = (payload && (payload.error_code || payload.error)) || '';
    if (status === 401 || status === 403 || code === 'bad_jwt' || code === 'session_not_found') {
      return { fatal: true };
    }
    if (code === 'same_password') {
      return { fatal: false, message: 'That is already your password. Choose a different one.' };
    }
    if (code === 'weak_password') {
      return { fatal: false, message: 'At least 8 characters, with a letter and a digit.' };
    }
    if (status === 429 || code === 'over_request_rate_limit') {
      return { fatal: false, message: 'Too many attempts just now. Give it a minute and try again.' };
    }
    var said = payload && (payload.msg || payload.error_description || payload.message);
    return {
      fatal: false,
      message:
        said && typeof said === 'string'
          ? said
          : 'Could not set the password just now (' + status + ').',
    };
  }

  toggle.addEventListener('click', function () {
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggle.textContent = showing ? 'Show' : 'Hide';
    toggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
    input.focus();
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var password = input.value || '';
    var complaint = complaintAbout(password);
    if (complaint) {
      showProblem(complaint);
      input.focus();
      return;
    }
    if (!token) {
      expired();
      return;
    }

    problem.hidden = true;
    busy(true);

    fetch(backend.url + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        apikey: backend.key,
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: password }),
    })
      .then(function (response) {
        /* The body is read either way: GoTrue explains its refusals there, and a 2xx
           carrying nothing is still a success. */
        return response.text().then(function (text) {
          var payload = null;
          try {
            payload = text ? JSON.parse(text) : null;
          } catch (e) {
            payload = null;
          }
          return { status: response.status, payload: payload };
        });
      })
      .then(function (result) {
        if (result.status >= 200 && result.status < 300) {
          var spent = token;
          token = '';
          input.value = '';
          succeeded(spent);
          return;
        }
        var verdict = refusal(result.status, result.payload);
        if (verdict.fatal) {
          token = '';
          expired();
          return;
        }
        busy(false);
        showProblem(verdict.message);
        input.focus();
      })
      ['catch'](function () {
        /* A network failure says nothing about the token, so the form is left exactly as
           it was and the button can simply be pressed again. */
        busy(false);
        showProblem('Could not reach the server. Check your connection and try again.');
      });
  });

  // ------------------------------------------------------------------- which link is this

  if (query.error || query.error_code) {
    var gone = /expired|invalid/i.test(query.error_code || query.error_description || '');
    say('🙈', 'Link problem', gone ? 'That link has expired.' : 'That link did not work.', [
      gone
        ? 'Links from Whaaack! are good for a limited time and can only be used once — this one is past it, or has already been used.'
        : query.error_description || 'The link could not be verified.',
      'Open Whaaack! in the Zepp app on your phone. If you were confirming an address, try signing in — it may be confirmed already. If you were resetting a password, ask for a new link.',
    ]);
    return;
  }

  if (query.type === 'recovery') {
    /* A recovery redirect with no token in it should not happen, but a mail client that
       rewrites links or drops fragments would produce exactly this — and inviting somebody
       to type a password into a form that cannot spend it is the one answer worse than
       saying so. */
    if (!token) {
      expired();
      return;
    }
    if (!configured) {
      say('🔑', 'Password reset', 'Cannot set it here just yet.', [
        'This page is not finished being set up, so it cannot reach the account service to save a new password.',
        'Get in touch at whaaack@idct.tech and we will sort it out.',
      ]);
      return;
    }
    say('🔑', 'Password reset', 'Choose a new password.', [
      'The link checked out. Type the password you want and it is yours — you will not be asked for the old one.',
    ]);
    form.hidden = false;
    input.focus();
    return;
  }

  if (token || query.type === 'signup' || query.type === 'email_change') {
    say('🍉', 'Account', 'Your email has been confirmed!', [
      'That is everything — the address is verified and the account is ready.',
      'Go back to Whaaack! in the Zepp app on your phone and sign in with the password you chose. Your watch runs will start appearing on the leaderboard.',
    ]);
    return;
  }

  /* Reached without any of it: somebody typed the address, or a mail client stripped the
     fragment on the way. Neither is a failure worth alarming anybody about. */
  say('🍉', 'Account', 'Nothing to do here.', [
    'This page is where links from Whaaack! land — confirming an address, or setting a new password. Open the link in the email you were sent and it will bring you back here with something to say.',
  ]);
})();
</script>
<script src="../assets/js/site.js" defer></script>
</body>
</html>
